name: PBRP Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'MANIFEST_URL'
        required: true
        default: 'https://github.com/PitchBlackRecoveryProject/manifest_pb'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'android-12.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL (for CD6)'
        required: true
        default: 'https://github.com/your-username/device_tecno_CD6'  # CHANGE THIS
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'pbrp-12.1'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/tecno/CD6'  # This matches your prebuilt path
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL'
        required: false
      COMMON_PATH:
        description: 'COMMON_PATH'
        required: false
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'CD6'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'pb_CD6'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'recoveryimage'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: Display Run Parameters
      run: |
        echo "::group::User Environment Variables"
        echo "Manifest URL: ${{ github.event.inputs.MANIFEST_URL }}"
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Tree URL: ${{ github.event.inputs.DEVICE_TREE_URL }}"
        echo "Device Tree Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Makefile Name: ${{ github.event.inputs.MAKEFILE_NAME }}"
        echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}"
        echo "::endgroup::"

    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare the environment
      run: |
        sudo apt update && sudo apt upgrade -y
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r) \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils \
            xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev \
            build-essential libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses6 python3 tar

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Setup SSH Keys
      if: ${{ startsWith(github.event.inputs.MANIFEST_URL, 'git@github.com') || 
          startsWith(github.event.inputs.DEVICE_TREE_URL, 'git@github.com') ||
          startsWith(github.event.inputs.COMMON_TREE_URL, 'git@github.com') }}
      uses: webfactory/ssh-agent@v0.9.0
      with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Install repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize repo
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        git config --global user.name "Nico170420"
        git config --global user.email "b170420nc@gmail.com"
        repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
      id: pwd

    - name: Repo Sync
      run: |
        repo sync -j$(nproc --all) --force-sync
      working-directory: workspace

    - name: Clone device tree
      run: |
        # Remove existing directory if present
        rm -rf ${{ github.event.inputs.DEVICE_PATH }}
        # Clone device tree
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ${{ github.event.inputs.DEVICE_PATH }}
        echo "Device tree cloned to: ${{ github.event.inputs.DEVICE_PATH }}"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Debug device tree location
      run: |
        echo "=== Checking device tree at: ${{ github.event.inputs.DEVICE_PATH }} ==="
        ls -la ${{ github.event.inputs.DEVICE_PATH }}/ || echo "Device path not found!"
        
        echo "=== Checking prebuilt directory ==="
        ls -la ${{ github.event.inputs.DEVICE_PATH }}/prebuilt/ 2>/dev/null || echo "No prebuilt directory!"
        
        echo "=== Searching for dtb.img ==="
        find ${{ github.event.inputs.DEVICE_PATH }} -name "dtb.img" 2>/dev/null || echo "No dtb.img found"
        
        echo "=== Listing all files in device tree ==="
        find ${{ github.event.inputs.DEVICE_PATH }} -type f | head -20
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone common tree
      if: |
        github.event.inputs.COMMON_TREE_URL != null
        && github.event.inputs.COMMON_PATH != null
      run: |
        git clone ${{ github.event.inputs.COMMON_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ${{ github.event.inputs.COMMON_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Check Build Tree
      uses: haya14busa/action-cond@v1
      id: buildtree
      with:
        cond: ${{ github.event.inputs.MANIFEST_BRANCH == 'twrp-11' || github.event.inputs.MANIFEST_BRANCH == 'twrp-12.1' }}
        if_true: twrp
        if_false: omni

    - name: Sync Device Dependencies
      run: |
        bash ${GITHUB_WORKSPACE}/scripts/convert.sh ${{ github.event.inputs.DEVICE_PATH }}/${{ steps.buildtree.outputs.value }}.dependencies
        repo sync -j$(nproc --all)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      continue-on-error: true

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12
        
    - name: Clean existing device trees
      run: |
        rm -rf device/transsion/mt6789-common || true

    - name: Pre-copy dtb.img to output directory
      run: |
        # Get the actual device path
        DEVICE_PATH="${{ github.event.inputs.DEVICE_PATH }}"
        echo "Using device path: $DEVICE_PATH"
        
        # Create output directory
        mkdir -p out/target/product/${{ github.event.inputs.DEVICE_NAME }}
        
        # Find dtb.img anywhere in device tree
        DTB_FILE=$(find $DEVICE_PATH -name "dtb.img" 2>/dev/null | head -1)
        
        if [ -n "$DTB_FILE" ]; then
          cp "$DTB_FILE" out/target/product/${{ github.event.inputs.DEVICE_NAME }}/dtb.img
          echo "✅ Copied dtb.img from $DTB_FILE"
        else
          echo "❌ dtb.img not found in device tree!"
          echo "Searching all locations..."
          find . -name "dtb.img" 2>/dev/null
          exit 1
        fi
        
        # Verify the copy
        ls -la out/target/product/${{ github.event.inputs.DEVICE_NAME }}/dtb.img
        file out/target/product/${{ github.event.inputs.DEVICE_NAME }}/dtb.img
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Pre-copy dtbo.img to output directory
      run: |
        DEVICE_PATH="${{ github.event.inputs.DEVICE_PATH }}"
        mkdir -p out/target/product/${{ github.event.inputs.DEVICE_NAME }}
        
        DTBO_FILE=$(find $DEVICE_PATH -name "dtbo.img" 2>/dev/null | head -1)
        
        if [ -n "$DTBO_FILE" ]; then
          cp "$DTBO_FILE" out/target/product/${{ github.event.inputs.DEVICE_NAME }}/dtbo.img
          echo "✅ Copied dtbo.img from $DTBO_FILE"
        else
          echo "⚠️ dtbo.img not found, continuing anyway..."
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Pre-copy kernel to output directory
      run: |
        DEVICE_PATH="${{ github.event.inputs.DEVICE_PATH }}"
        mkdir -p out/target/product/${{ github.event.inputs.DEVICE_NAME }}
        
        KERNEL_FILE=$(find $DEVICE_PATH/prebuilt -name "Image.gz" 2>/dev/null | head -1)
        
        if [ -n "$KERNEL_FILE" ]; then
          cp "$KERNEL_FILE" out/target/product/${{ github.event.inputs.DEVICE_NAME }}/kernel
          echo "✅ Copied kernel from $KERNEL_FILE"
        else
          echo "⚠️ Kernel not found in prebuilt, will be built from source"
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Building recovery
      run: |
        export TERM=xterm-256color
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-userdebug
        make clean
        m ${{ github.event.inputs.BUILD_TARGET }} -j$(nproc --all)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: | 
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*vendor*.img
        name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Target: ${{ github.event.inputs.BUILD_TARGET }}.img
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
